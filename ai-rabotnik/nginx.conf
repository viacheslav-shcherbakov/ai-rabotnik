# nginx config для AI-Rabotnik
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml+rss
        text/xml;

    # Кэширование статики
    location ~* \.(css|js|png|jpg|jpeg|webp|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    # manifest и service worker — не кэшируем
    location = /manifest.json { expires -1; add_header Cache-Control "no-cache"; }
    location = /sw.js          { expires -1; add_header Cache-Control "no-cache"; }

    # security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 404 → кастомная страница
    error_page 404 /404.html;

    # Статический сайт: отдаём реальные файлы, иначе — 404
    location / {
        try_files $uri $uri/ =404;
    }

    # robots и sitemap
    location = /robots.txt  { default_type text/plain; }
    location = /sitemap.xml { default_type application/xml; }
}
