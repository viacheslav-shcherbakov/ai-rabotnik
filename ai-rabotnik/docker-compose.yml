version: "3.9"

services:
  web:
    build: .
    image: ai-rabotnik:latest
    container_name: ai-rabotnik
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
